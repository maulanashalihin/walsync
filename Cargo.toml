[package]
name = "walsync"
version = "0.6.0"
edition = "2021"
description = "Live SQLite WAL shipping replication via gRPC"
license = "MIT"

[[bin]]
name = "walsync"
path = "src/main.rs"

[dependencies]
tonic = { version = "0.12", features = ["gzip"] }
prost = "0.13"
tokio = { version = "1", features = ["full"] }
notify = "7"
flate2 = "1"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"

[build-dependencies]
tonic-build = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
